server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # html sempre fresco; css e js versionados por ?v=; imagens e fontes por uma semana
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; }
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(webp|png|svg|ico|woff2)$ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; }
}
